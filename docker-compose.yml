services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: scanner
      POSTGRES_USER: scanner
      POSTGRES_PASSWORD: scanner
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanner"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]

  api:
    build: .
    environment:
      APP_ENV: ${APP_ENV:-development}
      DASHBOARD_UI: ${DASHBOARD_UI:-simple}
      APP_MODE: ${APP_MODE:-mock}
      MOCK_MODE: ${MOCK_MODE:-true}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://scanner:scanner@postgres:5432/scanner}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      KALSHI_MODE: ${KALSHI_MODE:-mock}
      KALSHI_REST_ENABLED: ${KALSHI_REST_ENABLED:-true}
      KALSHI_WS_ENABLED: ${KALSHI_WS_ENABLED:-false}
      KALSHI_BASE_URL: ${KALSHI_BASE_URL:-https://external-api.kalshi.com/trade-api/v2}
      KALSHI_WS_URL: ${KALSHI_WS_URL:-wss://external-api-ws.kalshi.com/trade-api/ws/v2}
      KALSHI_API_KEY_ID: ${KALSHI_API_KEY_ID:-}
      KALSHI_PRIVATE_KEY_PATH: ${KALSHI_PRIVATE_KEY_PATH:-}
      POLYMARKET_MODE: ${POLYMARKET_MODE:-mock}
      POLYMARKET_GAMMA_BASE_URL: ${POLYMARKET_GAMMA_BASE_URL:-https://gamma-api.polymarket.com}
      POLYMARKET_CLOB_BASE_URL: ${POLYMARKET_CLOB_BASE_URL:-https://clob.polymarket.com}
      POLYMARKET_DATA_BASE_URL: ${POLYMARKET_DATA_BASE_URL:-https://data-api.polymarket.com}
      POLYMARKET_WS_ENABLED: ${POLYMARKET_WS_ENABLED:-false}
      SPORTS_ODDS_MODE: ${SPORTS_ODDS_MODE:-mock}
      SPORTS_ODDS_BASE_URL: ${SPORTS_ODDS_BASE_URL:-https://api.oddspapi.io/v4}
      SPORTS_ODDS_API_KEY: ${SPORTS_ODDS_API_KEY:-}
      CLIENT_TIMEZONE: ${CLIENT_TIMEZONE:-America/New_York}
      PRICE_POLL_INTERVAL_SECONDS: ${PRICE_POLL_INTERVAL_SECONDS:-30}
      PROVIDER_REQUEST_CONCURRENCY: ${PROVIDER_REQUEST_CONCURRENCY:-8}
      LIVE_DRY_RUN: ${LIVE_DRY_RUN:-true}
      ALERTS_ENABLED: ${ALERTS_ENABLED:-false}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["8000:8000"]

volumes:
  postgres_data:
  redis_data:
